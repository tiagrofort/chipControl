<body class="bg-surface-container-low text-on-surface min-h-screen flex items-center justify-center relative overflow-hidden font-body-md selection:bg-primary-container selection:text-on-primary-container">
<!-- Silenced Background Decorative Elements for Corporate Feel -->
<div class="absolute inset-0 z-0 pointer-events-none opacity-40 bg-[linear-gradient(to_right,#e1e2e8_1px,transparent_1px),linear-gradient(to_bottom,#e1e2e8_1px,transparent_1px)] bg-[size:32px_32px]"></div>
<div class="absolute top-[-20%] left-[-10%] w-[50vw] h-[50vw] rounded-full bg-primary-fixed-dim/30 blur-[120px] z-0 pointer-events-none"></div>
<!-- Login Card (Level 2 Modal/Popup Elevation) -->
<main class="relative z-10 w-full max-w-[420px] mx-4 bg-surface-container-lowest border border-surface-variant rounded-lg p-10 shadow-[0_8px_32px_-12px_rgba(0,0,0,0.12)]">
<!-- Header & Logo -->
<header class="flex flex-col items-center mb-10 text-center">
<div class="w-14 h-14 rounded-DEFAULT bg-primary-container text-on-primary-container flex items-center justify-center mb-4 shadow-sm border border-primary">
<span class="material-symbols-outlined" data-weight="fill" style="font-size: 32px;">sim_card</span>
</div>
<h1 class="font-display text-display text-on-surface tracking-tight">Controle de Chips</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-2">Acesso Seguro ao Sistema</p>
</header>
<!-- Login Form -->
<form class="space-y-6" onsubmit="event.preventDefault();">
<!-- Username Input -->
<div class="space-y-stack_sm">
<label class="block font-label-sm text-label-sm text-on-surface uppercase tracking-wider" for="username">Nome de Usuário</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined" style="font-size: 20px;">person</span>
</div>
<input autocomplete="username" class="block w-full h-grid_row_height pl-10 pr-3 bg-surface-container-lowest border border-outline-variant rounded-DEFAULT text-on-surface font-body-md text-body-md focus:border-primary-container focus:ring-2 focus:ring-primary-container/20 transition-all duration-200" id="username" name="username" placeholder="Insira seu usuário" required="" spellcheck="false" type="text"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-stack_sm">
<label class="block font-label-sm text-label-sm text-on-surface uppercase tracking-wider" for="password">Senha</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined" style="font-size: 20px;">lock</span>
</div>
<input autocomplete="current-password" class="block w-full h-grid_row_height pl-10 pr-3 bg-surface-container-lowest border border-outline-variant rounded-DEFAULT text-on-surface font-body-md text-body-md focus:border-primary-container focus:ring-2 focus:ring-primary-container/20 transition-all duration-200" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Submit Action -->
<div class="pt-2">
<button class="w-full h-grid_row_height flex items-center justify-center gap-2 bg-primary-container hover:bg-primary text-on-primary-container hover:text-on-primary font-title-md text-title-md rounded-DEFAULT border border-transparent focus:outline-none focus:ring-2 focus:ring-primary-fixed focus:ring-offset-2 transition-colors duration-200 active:scale-[0.98]" type="submit">
<span>Entrar</span>
<span class="material-symbols-outlined" style="font-size: 20px;">login</span>
</button>
</div>
</form>
<!-- Footer Links -->
<footer class="mt-8 pt-6 border-t border-surface-variant text-center">
<a class="inline-flex items-center gap-1 font-body-md text-body-md text-primary-container hover:text-primary transition-colors group" href="#">
<span class="material-symbols-outlined text-[16px] group-hover:rotate-12 transition-transform duration-300">key</span>
<span class="underline-offset-4 group-hover:underline">Recuperação de Senha</span>
</a>
</footer>
</main>
